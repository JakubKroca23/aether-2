[package]
name = "aether"
version = "0.1.0"
edition = "2021"
description = "Petri dish of organisms controlled only by their own neural networks"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
rand = "0.8.5"
image = "0.24.9"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
