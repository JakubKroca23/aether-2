name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site

          hash8() { sha256sum "$1" | cut -c1-8; }

          WASM_SRC=target/wasm32-unknown-unknown/release/aether.wasm
          MQ_SRC=web/mq_js_bundle.js
          HOST_SRC=web/aether_host.js

          WASM_HASH=$(hash8 "$WASM_SRC")
          MQ_HASH=$(hash8 "$MQ_SRC")
          HOST_HASH=$(hash8 "$HOST_SRC")

          WASM_NAME="aether.${WASM_HASH}.wasm"
          MQ_NAME="mq_js_bundle.${MQ_HASH}.js"
          HOST_NAME="aether_host.${HOST_HASH}.js"

          cp "$WASM_SRC" "site/${WASM_NAME}"
          cp "$MQ_SRC" "site/${MQ_NAME}"
          cp "$HOST_SRC" "site/${HOST_NAME}"

          # Rewrite asset references in index.html (mq_js_bundle load("aether.wasm")
          # takes the path from the call site; no hard-coded wasm name inside the bundle).
          sed \
            -e "s|src=\"mq_js_bundle.js\"|src=\"${MQ_NAME}\"|" \
            -e "s|src=\"aether_host.js\"|src=\"${HOST_NAME}\"|" \
            -e "s|load(\"aether.wasm\")|load(\"${WASM_NAME}\")|" \
            web/index.html > site/index.html

          touch site/.nojekyll
          echo "Hashed assets: ${WASM_NAME} ${MQ_NAME} ${HOST_NAME}"
          cat site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
